name: GitLeaf
options:
  bundleIdPrefix: com.gitleaf
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

targets:
  GitLeaf:
    type: application
    platform: iOS
    sources:
      - path: GitLeaf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitleaf.ios
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: GitLeaf/Info.plist
      properties:
        CFBundleDisplayName: GitLeaf
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: "GitLeaf uses Bluetooth Low Energy to connect to OBD2 adapters (Veepeak, OBDLink CX, Vgate, LELink, Carista) and read live Nissan Leaf telemetry."
        NSLocalNetworkUsageDescription: "GitLeaf uses Local Network access to connect to Wi-Fi ELM327 OBD2 adapters (e.g. 192.168.0.10:35000)."
        UISupportedExternalAccessoryProtocols:
          - com.obdlink.protocol
        UIBackgroundModes:
          - bluetooth-central
